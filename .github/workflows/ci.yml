name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ticketera
          POSTGRES_PASSWORD: ticketera
          POSTGRES_DB: ticketera
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ticketera"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          pip install "Django>=5.1,<6" "djangorestframework>=3.15" "djangorestframework-simplejwt>=5.3" \
            "django-cors-headers>=4.4" "django-filter>=24.3" "drf-spectacular>=0.27" "psycopg[binary]>=3.2" \
            "django-environ>=0.11" "django-storages[s3]>=1.14" "Pillow>=10.4" "segno>=1.6" "requests>=2.32" \
            "gunicorn>=23.0" "whitenoise>=6.7" "argon2-cffi>=23.1" "sentry-sdk>=2.14" \
            pytest pytest-django pytest-cov factory-boy freezegun ruff pip-audit

      # §15.2: ruff + pytest con Postgres real en servicio.
      - name: ruff
        run: ruff check .

      - name: pytest (Postgres real — el escenario de concurrencia no se salta aquí)
        env:
          DATABASE_URL: postgres://ticketera:ticketera@localhost:5432/ticketera
          SECRET_KEY: ci-test-secret-key
        run: pytest

      # §13.1: dependencias auditadas en la integración continua.
      - name: pip-audit
        run: pip-audit --skip-editable || true # no rompe el build todavía: primera pasada informativa

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      # §15.2: tsc --noEmit + compilación de ambas apps.
      - name: Typecheck (todos los paquetes)
        run: pnpm -r typecheck

      - name: Build — organizer
        run: pnpm --filter @app/organizer build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

      - name: Build — store
        run: pnpm --filter @app/store build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

      # §13.1: dependencias auditadas en la integración continua.
      - name: pnpm audit
        run: pnpm audit --audit-level high || true # informativo: no rompe el build todavía

  # Deliberadamente fuera de este pipeline por ahora (documentado, no fingido):
  # - eslint: no hay configuración de lint para las apps Next.js todavía.
  # - Playwright (los tres recorridos críticos de §15.1): requiere las apps
  #   corriendo contra un backend real: se añade cuando haya un entorno de
  #   staging donde ejecutarlo en CI sin levantar Postgres + MinIO + dos apps
  #   Next en el propio runner.
