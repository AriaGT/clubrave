<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>{{ subject }}</title>
  </head>
  <body style="font-family: sans-serif; background:#09090B; color:#F4F4F5; padding:24px;">
    <h1 style="font-size:20px;">{{ event.title }}</h1>
    <p><strong>{{ subject }}</strong></p>
    <div style="border:1px solid #2E2E3A; border-radius:14px; padding:16px; margin:16px 0; white-space:pre-line;">
      {{ message }}
    </div>
    <p style="color:#8B8B98; font-size:13px;">Este correo fue enviado por el organizador del evento. Para dudas o cambios, respondé este correo.</p>
  </body>
</html>
